appId: io.github.manuelrtsch.sideplay
name: Prepare recording
---
- launchApp:
    stopApp: true
- assertVisible: "Sideplay"

# 1. Clear Recently played through Options -> Settings -> Clear history.
- pressKey: Remote Menu
- tapOn: "Settings"
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Clear history"
    direction: DOWN
- tapOn: "Clear history"
- tapOn: "Clear"
- tapOn: "Listening history cleared"
- waitForAnimationToEnd
- tapOn: "Back"
- assertVisible: "Sideplay"
- assertVisible: "Nothing played yet"

# 2. Start a known track so it plays in the background during the recording.
- tapOn: "Search"
- tapOn: "Search Spotify"
# The keypad mode is process-wide. Press a harmless key so the action bar appears,
# switch out of numeric mode if needed, then enter "toto" as T9 multi-tap digits
# (t o t o = 8 666 8 666). Avoid adjacent same-key letters: "africa" ends c+a = 2222.
- inputText: "0"
- extendedWaitUntil:
    visible: "Abc|ABC|abc|123"
    timeout: 10000
- runFlow:
    when:
      visible: "123"
    commands:
      - tapOn: "123"
      - extendedWaitUntil:
          visible: "Abc|ABC|abc"
          timeout: 5000
- eraseText: 40
- inputText: "86668666"
# Enter takes the exact suggestion and leaves the keypad open with Done still available.
- pressKey: Enter
- waitForAnimationToEnd
- tapOn: "Africa"
# If the track was already current, Africa opens Now Playing instead of starting it.
# If it was not current, the now-playing notice appears on the search screen.
- runFlow:
    when:
      visible: "Playing Africa. Open Now Playing"
    commands:
      - tapOn: "Playing Africa. Open Now Playing"
- runFlow:
    when:
      visible: "Play"
    commands:
      - tapOn: "Play"
- waitForAnimationToEnd
# Leave Now Playing, close the keypad, and go back from Search so the recording starts on Home.
- runFlow:
    when:
      visible: "Back"
    commands:
      - tapOn: "Back"
- runFlow:
    when:
      visible: "Done"
    commands:
      - tapOn: "Done"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Back"
    commands:
      - tapOn: "Back"
- assertVisible: "Sideplay"
- assertVisible: "NOW PLAYING"
- assertVisible: "Africa"
