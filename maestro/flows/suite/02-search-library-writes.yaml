appId: io.github.manuelrtsch.sideplay
name: Search & Library Writes
---
# Fixture assumptions: signed in and on Home. The pinned query is "bowie", entered
# as T9 multi-tap digits (b 22, o 666, w 9, i 444, e 33) because Maestro's inputText
# becomes key events on this keypad. The account must have at least one searchable
# show for this query; artist and album sections must also be present.
# No artist, album, show, or episode titles are hardcoded.
# Account mode: any artist, album or show matching the query works; the demo pack
# ships David Bowie, his two albums and the show "Bowie: A Life".
- launchApp
- assertVisible: "Sidetrack"

# 1. Search the pinned query. The keypad's mode is process-wide, so switch it back
# to multi-tap if a previous run left it in numeric mode.
- tapOn:
    text: "Search"
    waitToSettleTimeoutMs: 200
- assertVisible: "Search Spotify"
- tapOn:
    text: "Search Spotify"
    waitToSettleTimeoutMs: 200
# The keypad action bar only appears after the first key press. Press a harmless key,
# then read its mode. The mode is process-wide and can be numeric from an earlier
# session; only then is there a "123" button to switch back to multi-tap. The probe
# character is the only thing erased, so eraseText stays cheap.
- inputText: "0"
- extendedWaitUntil:
    visible: "Abc|ABC|abc|123"
    timeout: 10000
- runFlow:
    when:
      visible: "123"
    commands:
      - tapOn:
          text: "123"
          waitToSettleTimeoutMs: 200
      - extendedWaitUntil:
          visible: "Abc|ABC|abc"
          timeout: 5000
- eraseText: 2
- inputText: "22666944433"
- pressKey: Enter
# The in-app keypad stays open after Enter. Rather than paying a ~2.7 s Done tap
# after every Back, centre each scroll target: the taps then land above the
# keypad instead of under it.
- assertVisible: "TRACKS"

# 2. Open the first artist result and flip Follow once. Reading the current label
# first lets one tap prove the write without a second toggle or a dead guard.
- scrollUntilVisible:
    element:
      text: "Artist"
    direction: DOWN
    speed: 80
    visibilityPercentage: 60
    centerElement: true
    waitToSettleTimeoutMs: 200
- tapOn:
    text: "Artist"
    index: 0
    waitToSettleTimeoutMs: 200
- assertVisible: "TOP TRACKS"
- copyTextFrom:
    text: "^(Follow|Following)$"
- evalScript: ${output.followLabel = maestro.copiedText}
- tapOn:
    text: "^(Follow|Following)$"
    waitToSettleTimeoutMs: 200
- assertNotVisible: "^${output.followLabel}$"
# Back returns to the results with the keypad still open; the next scroll
# centres ALBUMS above it.
- pressKey: Back
- assertVisible: "Artist"

# 3. Open an album result and flip Save once.
- scrollUntilVisible:
    element:
      text: "ALBUMS"
    direction: DOWN
    speed: 80
    visibilityPercentage: 60
    centerElement: true
    waitToSettleTimeoutMs: 200
- tapOn:
    below:
      text: "ALBUMS"
    waitToSettleTimeoutMs: 200
- assertVisible: "Sav(e|ed)"
- copyTextFrom:
    text: "^(Save|Saved)$"
- evalScript: ${output.saveLabel = maestro.copiedText}
- tapOn:
    text: "^(Save|Saved)$"
    waitToSettleTimeoutMs: 200
- assertNotVisible: "^${output.saveLabel}$"
- pressKey: Back
- assertVisible: "ALBUMS"

# 4. Scroll to the shows section and assert it. Playback is covered
# by the promo variant; the suite keeps the section assertion to stay under 45 s.
- scrollUntilVisible:
    element:
      text: "SHOWS"
    direction: DOWN
    speed: 80
    visibilityPercentage: 60
    centerElement: true
    waitToSettleTimeoutMs: 200
- assertVisible: "SHOWS"
