appId: io.github.manuelrtsch.sideplay
name: Queue & Transport
---
# Fixture assumptions: signed in and on Home, one current track, at least two
# recently played rows, and at least two upcoming queue items. No track titles
# are hardcoded: durations identify rows and the generated Add/Remove labels
# identify queue actions.
- launchApp
- assertVisible: "Sideplay"
- assertVisible: "RECENTLY PLAYED"

# 1. Make a track current even if a previous flow left an episode playing, then
# add two recent tracks to the queue. Tracks are m:ss; episodes are h:mm:ss, so
# the m:ss-only selector skips episode rows on Home.
- scrollUntilVisible:
    element:
      text: "[0-9]+:[0-9]{2}"
      index: 1
    direction: DOWN
    speed: 80
    visibilityPercentage: 60
    waitToSettleTimeoutMs: 200
- tapOn:
    text: "[0-9]+:[0-9]{2}"
    index: 0
    waitToSettleTimeoutMs: 200
# An already-current track opens Now Playing directly; a new one stays on Home
# with a four-second notice. Handle both, then wait for the notice to clear.
- runFlow:
    when:
      visible: "Previous"
    commands:
      - pressKey: Back
- extendedWaitUntil:
    visible: "Queue"
    timeout: 10000
- swipe:
    from:
      text: "[0-9]+:[0-9]{2}"
      index: 0
    direction: LEFT
    waitToSettleTimeoutMs: 200
- tapOn:
    text: "Add .* to queue"
    waitToSettleTimeoutMs: 200
- swipe:
    from:
      text: "[0-9]+:[0-9]{2}"
      index: 1
    direction: LEFT
    waitToSettleTimeoutMs: 200
- tapOn:
    text: "Add .* to queue"
    waitToSettleTimeoutMs: 200

# 2. Open the queue.
- tapOn:
    text: "Queue"
    waitToSettleTimeoutMs: 200
- assertVisible: "Queue"

# 3. Remove the first upcoming item and undo it. Index 0 is the current row.
- swipe:
    from:
      text: "[0-9]+:[0-9]{2}(:[0-9]{2})?"
      index: 1
    direction: LEFT
    waitToSettleTimeoutMs: 200
- tapOn:
    text: "Remove .* from queue"
    waitToSettleTimeoutMs: 200
# Undo is only offered for five seconds; tap it without a settle wait in between.
- tapOn:
    text: "Undo"
    waitToSettleTimeoutMs: 0
- assertNotVisible: "Undo"

# 4. Clear the upcoming queue and undo it.
- tapOn:
    text: "Clear"
    waitToSettleTimeoutMs: 0
- tapOn:
    text: "Undo"
    waitToSettleTimeoutMs: 0
- assertNotVisible: "Undo"

# 5. Optional shuffle, then open Now Playing from Options. Shuffle keeps the
# options bar open, so Now playing is the other option in the same bar.
- pressKey: Remote Menu
- runFlow:
    when:
      visible: "Shuffle off"
    commands:
      - tapOn:
          text: "Shuffle off"
          waitToSettleTimeoutMs: 200
      - assertVisible: "Shuffle on"
- runFlow:
    when:
      visible: "Shuffle on"
    commands:
      - tapOn:
          text: "Shuffle on"
          waitToSettleTimeoutMs: 200
      - assertVisible: "Shuffle off"
- runFlow:
    when:
      notVisible: "Now playing"
    commands:
      - pressKey: Remote Menu
- tapOn:
    text: "Now playing"
    waitToSettleTimeoutMs: 200

# 6. Assert the transport controls.
- assertVisible: "Previous"
- assertVisible: "Pause|Play"
- assertVisible: "Next"
- assertVisible: "Sav(e|ed)"
- assertVisible: "Seek"
- assertVisible: "Repeat: (off|context|track)"

# 7. Toggle play/pause both ways, restoring the original state.
- runFlow:
    when:
      visible: "Pause"
    commands:
      - tapOn:
          text: "Pause"
          waitToSettleTimeoutMs: 200
      - assertVisible: "Play"
- runFlow:
    when:
      visible: "Play"
    commands:
      - tapOn:
          text: "Play"
          waitToSettleTimeoutMs: 200
      - assertVisible: "Pause"

# 8. Next keeps Now Playing open.
- tapOn:
    text: "Next"
    waitToSettleTimeoutMs: 200
- assertVisible: "Previous"
- assertVisible: "Seek"

# 9. Cycle repeat through all labels and back to off.
- runFlow:
    when:
      visible: "Repeat: off"
    commands:
      - tapOn:
          text: "Repeat: off"
          waitToSettleTimeoutMs: 200
      - assertVisible: "Repeat: context"
- runFlow:
    when:
      visible: "Repeat: context"
    commands:
      - tapOn:
          text: "Repeat: context"
          waitToSettleTimeoutMs: 200
      - assertVisible: "Repeat: track"
- runFlow:
    when:
      visible: "Repeat: track"
    commands:
      - tapOn:
          text: "Repeat: track"
          waitToSettleTimeoutMs: 200
      - assertVisible: "Repeat: off"

# 10. Toggle Save and leave the current track saved.
- runFlow:
    when:
      visible: "Saved"
    commands:
      - tapOn:
          text: "Saved"
          waitToSettleTimeoutMs: 200
      - assertVisible: "Save"
- runFlow:
    when:
      visible: "Save"
    commands:
      - tapOn:
          text: "Save"
          waitToSettleTimeoutMs: 200
      - assertVisible: "Saved"

# End on Now Playing.
