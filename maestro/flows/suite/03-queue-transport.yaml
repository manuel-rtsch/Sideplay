appId: io.github.manuelrtsch.sidetrack
name: Queue & Transport
---
# Fixture assumptions: signed in and on Home, one current track, at least two
# recently played rows, and at least two upcoming queue items. No track titles
# are hardcoded: durations identify rows and the generated Add/Remove labels
# identify queue actions.
- launchApp
- assertVisible: "Sidetrack"
- assertVisible: "RECENTLY PLAYED"

# 1. The previous flow may leave an episode current; the transport tests need a
# track (episodes have no Save/Seek). A track tap stays on Home unless that track
# is already current, in which case it opens Now Playing and we go back.
- tapOn:
    text: "[0-9]+:[0-9]{2}"
    index: 1
    waitToSettleTimeoutMs: 200
- runFlow:
    when:
      visible: "Previous"
    commands:
      - pressKey: Back

# 2. Add two recent tracks to the queue. Tracks are m:ss; episodes are h:mm:ss,
# so the m:ss-only selector skips episode rows on Home.
- longPressOn:
    text: "[0-9]+:[0-9]{2}"
    index: 0
- tapOn:
    text: "Add .* to queue"
    waitToSettleTimeoutMs: 200
- longPressOn:
    text: "[0-9]+:[0-9]{2}"
    index: 1
- tapOn:
    text: "Add .* to queue"
    waitToSettleTimeoutMs: 200

# 2. Open the queue.
- tapOn:
    text: "Queue"
    waitToSettleTimeoutMs: 200
- assertVisible: "Queue"

# 3. Remove the first upcoming item and undo it. Index 0 is the current row.
- swipe:
    from:
      text: "[0-9]+:[0-9]{2}(:[0-9]{2})?"
      index: 1
    direction: LEFT
    waitToSettleTimeoutMs: 200
- tapOn:
    text: "Remove .* from queue"
    waitToSettleTimeoutMs: 200
# Undo is only offered for five seconds; tap it without a settle wait in between.
- tapOn:
    text: "Undo"
    waitToSettleTimeoutMs: 0
- assertNotVisible: "Undo"

# 4. Clear the upcoming queue, confirm it, then undo it.
- tapOn:
    text: "Clear"
    waitToSettleTimeoutMs: 0
- assertVisible: "Cancel"
- tapOn:
    text: "Clear"
    waitToSettleTimeoutMs: 0
- tapOn:
    text: "Undo"
    waitToSettleTimeoutMs: 0
- assertNotVisible: "Undo"

# 5. Return Home and open Now Playing from the now-playing tile. The queue no
# longer duplicates that navigation in Options.
- pressKey: Back
- assertVisible: "Sidetrack"
- tapOn:
    text: "NOW PLAYING"
    waitToSettleTimeoutMs: 200

# 6. Assert the transport controls.
- assertVisible: "Previous"
- assertVisible: "Pause|Play"
- assertVisible: "Next"
- assertVisible: "Sav(e|ed)"
- assertVisible: "Seek"
- assertVisible: "Repeat: (off|context|track)"

# 7. Toggle play/pause once. Reading the current label lets one tap prove the
# change in either direction without a guard that waits 7 s on a miss.
- copyTextFrom:
    text: "^(Pause|Play)$"
- evalScript: ${output.transportLabel = maestro.copiedText}
- tapOn:
    text: "^(Pause|Play)$"
    waitToSettleTimeoutMs: 200
- assertNotVisible: "^${output.transportLabel}$"

# 8. Next keeps Now Playing open.
- tapOn:
    text: "Next"
    waitToSettleTimeoutMs: 200
- assertVisible: "Previous"
- assertVisible: "Seek"

# 9. Cycle repeat once; the label encodes the new state.
- copyTextFrom:
    text: "Repeat: (off|context|track)"
- evalScript: ${output.repeatLabel = maestro.copiedText}
- tapOn:
    text: "Repeat: (off|context|track)"
    waitToSettleTimeoutMs: 200
- assertNotVisible: "^${output.repeatLabel}$"

# 10. Toggle Save once.
- copyTextFrom:
    text: "^(Save|Saved)$"
- evalScript: ${output.saveLabel = maestro.copiedText}
- tapOn:
    text: "^(Save|Saved)$"
    waitToSettleTimeoutMs: 200
- assertNotVisible: "^${output.saveLabel}$"

# End on Now Playing.
