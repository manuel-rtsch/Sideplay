appId: io.github.manuelrtsch.sideplay
name: Browse & Play
---
# Fixture assumptions: signed in, at least two followed artists, the second followed
# artist has at least three top tracks and at least one album with tracks.
# No artist, album, or track titles are hardcoded. Durations identify playable rows,
# and the album row is selected by its year / track-count subtitle.
#
# Settle times: animations are disabled for recordings, so the pre-tap hierarchy
# re-dump does not need its default 1.5 s. 200 ms is enough to catch layout changes
# but keeps each tap cheap; override per command if a tap starts racing the UI.
- launchApp
- assertVisible: "Sideplay"

# 1. Open the Library and the second followed artist.
- tapOn:
    text: "Library"
    waitToSettleTimeoutMs: 200
- assertVisible: "Library"
- scrollUntilVisible:
    element:
      text: "Artist"
      index: 1
    direction: DOWN
    speed: 80
    visibilityPercentage: 60
    waitToSettleTimeoutMs: 200
- tapOn:
    text: "Artist"
    index: 1
    waitToSettleTimeoutMs: 200
- assertVisible: "TOP TRACKS"

# 2. Play the third top track.
- tapOn:
    text: "[0-9]+:[0-9]{2}"
    index: 2
    waitToSettleTimeoutMs: 200
# The four-second confirmation can expire before Maestro taps it, so open Now
# Playing from Options instead of racing the notice. If the track was already
# current, the tap above opened Now Playing directly and this step is skipped.
- runFlow:
    when:
      visible: "TOP TRACKS"
    commands:
      - pressKey: Remote Menu
      - tapOn:
          text: "Now playing"
          waitToSettleTimeoutMs: 200
- assertVisible: "Sav(e|ed)"
- assertVisible: "Previous"

# 3. Back to the artist, then open its first album.
- pressKey: Back
- assertVisible: "TOP TRACKS"
- scrollUntilVisible:
    element:
      text: "ALBUMS"
    direction: DOWN
    speed: 80
    visibilityPercentage: 60
    waitToSettleTimeoutMs: 200
- tapOn:
    text: "[0-9]{4}( · [0-9]+ tracks)?"
    index: 0
    waitToSettleTimeoutMs: 200
- assertVisible: "Sav(e|ed)"

# 4. Play the album's first track and open Now Playing.
- tapOn:
    text: "[0-9]+:[0-9]{2}"
    index: 0
    waitToSettleTimeoutMs: 200
# Same guard as above: an already-current album track opens Now Playing directly.
- runFlow:
    when:
      notVisible: "Previous"
    commands:
      - pressKey: Remote Menu
      - tapOn:
          text: "Now playing"
          waitToSettleTimeoutMs: 200
- assertVisible: "Sav(e|ed)"
- assertVisible: "Previous"

# 5. Back to the artist and play another top track. This adds a history entry
# before flow 4 removes one, so repeated suite runs do not slowly drain the
# fixture. The album may be a single, so use the artist's top tracks instead.
- pressKey: Back
- assertVisible: "Sav(e|ed)"
- pressKey: Back
- scrollUntilVisible:
    element:
      text: "TOP TRACKS"
    direction: UP
    speed: 80
    visibilityPercentage: 60
    waitToSettleTimeoutMs: 200
- tapOn:
    text: "[0-9]+:[0-9]{2}"
    index: 1
    waitToSettleTimeoutMs: 200
- runFlow:
    when:
      notVisible: "Previous"
    commands:
      - pressKey: Remote Menu
      - tapOn:
          text: "Now playing"
          waitToSettleTimeoutMs: 200
- assertVisible: "Sav(e|ed)"
- assertVisible: "Previous"

# 6. Now Playing -> artist -> Library -> Home.
- pressKey: Back
- assertVisible: "TOP TRACKS"
- pressKey: Back
- assertVisible: "Library"
- tapOn:
    text: "Sideplay"
    waitToSettleTimeoutMs: 200
- assertVisible: "Sideplay"
