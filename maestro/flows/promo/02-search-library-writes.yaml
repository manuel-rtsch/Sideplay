appId: io.github.manuelrtsch.sideplay
name: Search & Library Writes (promo)
---
# Fixture assumptions: signed in and on Home. The pinned query is "Die drei", entered
# as T9 multi-tap digits (3 444 33 0 3 777 33 444) because Maestro's inputText
# becomes key events on this keypad. The account must have at least one searchable
# show for this query; artist and album sections must also be present.
# No artist, album, show, or episode titles are hardcoded.
- launchApp:
    stopApp: false
- assertVisible: "Sideplay"

# 1. Search the pinned query.
- tapOn:
    text: "Search"
    waitToSettleTimeoutMs: 200
- tapOn:
    text: "Search Spotify"
    waitToSettleTimeoutMs: 200
# The prep left the keypad in multi-tap mode, so the mode probe is skipped.
- inputText: "3444330377733444"
- pressKey: Enter
# The in-app keypad stays open after Enter. Rather than paying a ~2.7 s Done tap
# after every Back, centre each scroll target: the taps then land above the
# keypad instead of under it.

# 2. Open the first artist result and flip Follow once. Reading the current label
# first lets one tap prove the write without a second toggle or a dead guard.
- scrollUntilVisible:
    element:
      text: "Artist"
    direction: DOWN
    speed: 80
    visibilityPercentage: 60
    centerElement: true
    waitToSettleTimeoutMs: 200
- tapOn:
    text: "Artist"
    index: 0
    waitToSettleTimeoutMs: 200
- assertVisible: "TOP TRACKS"
- copyTextFrom:
    text: "^(Follow|Following)$"
- evalScript: ${output.followLabel = maestro.copiedText}
- tapOn:
    text: "^(Follow|Following)$"
    waitToSettleTimeoutMs: 200
- assertNotVisible: "^${output.followLabel}$"
# Back returns to the results with the keypad still open; the next scroll
# centres ALBUMS above it.
- pressKey: Back

# 3. Open an album result and flip Save once.
- scrollUntilVisible:
    element:
      text: "ALBUMS"
    direction: DOWN
    speed: 80
    visibilityPercentage: 60
    centerElement: true
    waitToSettleTimeoutMs: 200
- tapOn:
    below:
      text: "ALBUMS"
    waitToSettleTimeoutMs: 200
- assertVisible: "Sav(e|ed)"
- copyTextFrom:
    text: "^(Save|Saved)$"
- evalScript: ${output.saveLabel = maestro.copiedText}
- tapOn:
    text: "^(Save|Saved)$"
    waitToSettleTimeoutMs: 200
- assertNotVisible: "^${output.saveLabel}$"
- pressKey: Back

# 4. Open the first show result and play its first episode.
- scrollUntilVisible:
    element:
      text: "SHOWS"
    direction: DOWN
    speed: 80
    visibilityPercentage: 60
    # The first result row is tapped relative to this heading, so the heading
    # must end up above the fold, not merely 60% visible at the bottom edge.
    centerElement: true
    waitToSettleTimeoutMs: 200
- tapOn:
    below:
      text: "SHOWS"
    waitToSettleTimeoutMs: 200
- assertVisible: "Sav(e|ed)"
- assertVisible: "[0-9]+:[0-9]{2}(:[0-9]{2})?"
- tapOn:
    text: "[0-9]+:[0-9]{2}(:[0-9]{2})?"
    index: 0
    waitToSettleTimeoutMs: 200
# The episode may already be current, which opens Now Playing directly, or it may
# start playing and leave us on the show page. Options handles the second case.
- runFlow:
    when:
      notVisible: "Previous"
    commands:
      - pressKey: Remote Menu
      - tapOn:
          text: "Now playing"
          waitToSettleTimeoutMs: 200
- assertVisible: "Previous"
- assertVisible: "Pause|Play"
