appId: io.github.manuelrtsch.sideplay
name: Browse & Play (promo)
---
# Recording-first variant of flows/suite/01-browse-play.yaml.
#
# The suite keeps the state guards: they make a run robust against whatever a
# previous flow left on the device. A recording does not need the fixture-dead
# guards, because flows/utility/record-prepare.yaml reseeds the device and starts
# a known track (Africa) immediately before this flow runs. Every `runFlow when`
# guard that can never match here still costs its full visibility timeout (~7 s).
#
# Keep the guards that depend on which row the tap landed on. A track tap opens
# Now Playing directly when that track is already current, and the selected row
# is not stable (it depends on the scroll position); without the guard the
# following Options -> "Now playing" tap has nowhere to go. When the guard does
# match it costs only a hierarchy dump, not the 7 s miss.
#
# Same fixture assumptions as the suite flow: signed in, at least two followed
# artists, the second followed artist has at least three top tracks and at least
# one album with tracks. No titles are hardcoded.
#
# launchApp is warm: the prep just left Sideplay on Home, so there is no splash
# to record and no reason to restart the process.
- launchApp:
    stopApp: false
- assertVisible: "Sideplay"

# 1. Open the Library and the second followed artist.
- tapOn:
    text: "Library"
    waitToSettleTimeoutMs: 200
- assertVisible: "Library"
# Anchor the scroll to the section heading, not to a label that can be clipped
# at the bottom edge. The heading is stable; the second "Artist" label below it
# is the second followed artist.
#
# The Library remembers its scroll position between runs, so first reset to the
# top section, then come down to the artists. Without the reset, a Library left
# at the artists makes a DOWN-only scroll miss the header.
- scrollUntilVisible:
    element:
      text: "LIKED SONGS"
    direction: UP
    speed: 80
    visibilityPercentage: 60
    waitToSettleTimeoutMs: 200
- scrollUntilVisible:
    element:
      text: "FOLLOWED ARTISTS"
    direction: DOWN
    speed: 80
    visibilityPercentage: 60
    waitToSettleTimeoutMs: 200
# The heading stops at the bottom of the viewport, where only one artist row is
# fully visible. Move the section up a fixed amount so the first two "Artist"
# labels are on screen, then index 1 is reliably the second followed artist.
- swipe:
    start: "50%, 55%"
    end: "50%, 30%"
    duration: 300
- tapOn:
    text: "Artist"
    index: 1
    waitToSettleTimeoutMs: 200
- assertVisible: "TOP TRACKS"

# 2. Play the third top track, then open Now Playing from Options. The prep left
# Africa current, but the selected row is not guaranteed to be a different track,
# so keep the guard.
- tapOn:
    text: "[0-9]+:[0-9]{2}"
    index: 2
    waitToSettleTimeoutMs: 200
- runFlow:
    when:
      visible: "TOP TRACKS"
    commands:
      - pressKey: Remote Menu
      - tapOn:
          text: "Now playing"
          waitToSettleTimeoutMs: 200
- assertVisible: "Sav(e|ed)"
- assertVisible: "Previous"

# 3. Back to the artist, then open its first album.
- pressKey: Back
- assertVisible: "TOP TRACKS"
- scrollUntilVisible:
    element:
      text: "ALBUMS"
    direction: DOWN
    speed: 80
    visibilityPercentage: 60
    waitToSettleTimeoutMs: 200
- tapOn:
    text: "[0-9]{4}( · [0-9]+ tracks)?"
    index: 0
    waitToSettleTimeoutMs: 200
- assertVisible: "Sav(e|ed)"

# 4. Play the album's first track and open Now Playing.
- tapOn:
    text: "[0-9]+:[0-9]{2}"
    index: 0
    waitToSettleTimeoutMs: 200
- runFlow:
    when:
      notVisible: "Previous"
    commands:
      - pressKey: Remote Menu
      - tapOn:
          text: "Now playing"
          waitToSettleTimeoutMs: 200
- assertVisible: "Sav(e|ed)"
- assertVisible: "Previous"

# End on Now Playing. The extra play and the walk back through artist, Library,
# and Home were ~20 s of dead time, and they also forced the fragile "another top
# track" selection above. The two plays already add history entries.
