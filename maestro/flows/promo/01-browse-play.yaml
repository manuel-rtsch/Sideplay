appId: io.github.manuelrtsch.sidetrack
name: Browse & Play (promo)
---
# Recording-first variant of flows/suite/01-browse-play.yaml, but deliberately not the
# same story: this take is the Library tour — Home, liked songs, a playlist, an album
# and a show, each opened once, with playback started from three different places and
# finished on Now Playing. Search results, write actions (Follow/Save), artist pages
# and episodes belong to promo 02, so the two takes never show the same sequence.
#
# Fixture assumptions: signed in, on Home, at least one liked track, one saved
# playlist, one saved album with tracks, one saved show, and a current track. No
# titles are hardcoded: durations identify playable rows and section labels anchor
# the rows below them.
#
# No state guards: flows/utility/record-prepare-demo.yaml cold-launches the app and
# the demo pack rewrites history and queue at every process start, so a take always
# begins on the same Home. A guard that can never match still costs its full
# visibility timeout (~7 s).
- launchApp:
    stopApp: false
- assertVisible: "Sidetrack"
- assertVisible: "NOW PLAYING"

# 1. The hero tile opens Now Playing. The prep left a track current, so this is a
# live transport on the first screen of the take.
- tapOn:
    text: "NOW PLAYING"
    waitToSettleTimeoutMs: 200
- assertVisible: "Previous"
- assertVisible: "Pause|Play"
- pressKey: Back
- assertVisible: "Sidetrack"

# 2. A recent row is the second way into playback. Nothing else is asserted: the row
# starts playing, the notice says so, and the take moves on.
- tapOn:
    text: "[0-9]+:[0-9]{2}"
    index: 1
    waitToSettleTimeoutMs: 200

# 3. Liked songs: play the first one straight from the Library list. This is the
# third way in — no Now Playing screen involved, only the notice. The category row
# stays fixed under the title, so each category is one tap rather than a scroll.
- tapOn:
    text: "Library"
    waitToSettleTimeoutMs: 200
- assertVisible: "Library"
- tapOn:
    text: "Liked songs"
    waitToSettleTimeoutMs: 200
- tapOn:
    text: "[0-9]+:[0-9]{2}"
    index: 0
    waitToSettleTimeoutMs: 200

# 3b. Scroll the attached liked-songs list for the gallery. The filter row stays
# in place, so the take does not leave the Library to show a long list.
- swipe:
    direction: UP
    duration: 400
- assertVisible: "[0-9]+:[0-9]{2}"

# 4. Playlists: open the first one and play its second track, then come back. The
# playlist screen is the one long track list in the take.
- tapOn:
    text: "Playlists"
    waitToSettleTimeoutMs: 200
- tapOn:
    below:
      text: "Playlists"
    waitToSettleTimeoutMs: 200
- assertVisible: "[0-9]+:[0-9]{2}"
- tapOn:
    text: "[0-9]+:[0-9]{2}"
    index: 1
    waitToSettleTimeoutMs: 200
- pressKey: Back
- assertVisible: "Library"

# 5. Albums: open the first saved album and play from it. The Save button is left
# alone — promo 02 owns the write actions.
- tapOn:
    text: "Albums"
    waitToSettleTimeoutMs: 200
- tapOn:
    below:
      text: "Albums"
    waitToSettleTimeoutMs: 200
- assertVisible: "Sav(e|ed)"
- tapOn:
    text: "[0-9]+:[0-9]{2}"
    index: 0
    waitToSettleTimeoutMs: 200
- pressKey: Back
- assertVisible: "Library"

# 6. Shows: open the first saved show and look at its episode list. Nothing is
# played here; the episode beat belongs to promo 02.
- tapOn:
    text: "Shows"
    waitToSettleTimeoutMs: 200
- tapOn:
    below:
      text: "Shows"
    waitToSettleTimeoutMs: 200
- assertVisible: "[0-9]+:[0-9]{2}(:[0-9]{2})?"
- pressKey: Back
- assertVisible: "Library"

# 7. Home again, and end on Now Playing from the hero — the same screen the take
# opened with, now showing the album track started in step 5. Closing the arc on the
# hero avoids a long scroll back up the Library and gives the four-up grid a common
# final state.
- pressKey: Back
- assertVisible: "Sidetrack"
- tapOn:
    text: "NOW PLAYING"
    waitToSettleTimeoutMs: 200
- assertVisible: "Previous"
- assertVisible: "Pause|Play"
