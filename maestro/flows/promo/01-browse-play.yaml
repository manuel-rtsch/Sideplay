appId: io.github.manuelrtsch.sideplay
name: Browse & Play (promo)
---
# Recording-first variant of flows/suite/01-browse-play.yaml.
#
# The suite keeps the state guards: they make a run robust against whatever a
# previous flow left on the device. A recording does not need them, because
# flows/utility/record-prepare.yaml reseeds the device and starts a known track
# (Africa) immediately before this flow runs. Every `runFlow when` guard that can
# never match here still costs its full visibility timeout (~7 s), so this flow
# takes the intended path directly.
#
# Same fixture assumptions as the suite flow: signed in, at least two followed
# artists, the second followed artist has at least three top tracks and at least
# one album with tracks. No titles are hardcoded.
#
# launchApp is warm: the prep just left Sideplay on Home, so there is no splash
# to record and no reason to restart the process.
- launchApp:
    stopApp: false
- assertVisible: "Sideplay"

# 1. Open the Library and the second followed artist.
- tapOn:
    text: "Library"
    waitToSettleTimeoutMs: 200
- assertVisible: "Library"
- scrollUntilVisible:
    element:
      text: "Artist"
      index: 1
    direction: DOWN
    speed: 80
    visibilityPercentage: 60
    waitToSettleTimeoutMs: 200
- tapOn:
    text: "Artist"
    index: 1
    waitToSettleTimeoutMs: 200
- assertVisible: "TOP TRACKS"

# 2. Play the third top track, then open Now Playing from Options. The prep left
# Africa current, so this track is never current and the tap always stays on the
# artist page; the guard that the suite needs would always miss and cost ~7 s.
- tapOn:
    text: "[0-9]+:[0-9]{2}"
    index: 2
    waitToSettleTimeoutMs: 200
- pressKey: Remote Menu
- tapOn:
    text: "Now playing"
    waitToSettleTimeoutMs: 200
- assertVisible: "Sav(e|ed)"
- assertVisible: "Previous"

# 3. Back to the artist, then open its first album.
- pressKey: Back
- assertVisible: "TOP TRACKS"
- scrollUntilVisible:
    element:
      text: "ALBUMS"
    direction: DOWN
    speed: 80
    visibilityPercentage: 60
    waitToSettleTimeoutMs: 200
- tapOn:
    text: "[0-9]{4}( · [0-9]+ tracks)?"
    index: 0
    waitToSettleTimeoutMs: 200
- assertVisible: "Sav(e|ed)"

# 4. Play the album's first track and open Now Playing.
- tapOn:
    text: "[0-9]+:[0-9]{2}"
    index: 0
    waitToSettleTimeoutMs: 200
- pressKey: Remote Menu
- tapOn:
    text: "Now playing"
    waitToSettleTimeoutMs: 200
- assertVisible: "Sav(e|ed)"
- assertVisible: "Previous"

# 5. Back to the artist and play another top track. This adds the history entry
# that flow 4 removes, so repeated suite runs do not slowly drain the fixture.
- pressKey: Back
- assertVisible: "Sav(e|ed)"
- pressKey: Back
- scrollUntilVisible:
    element:
      text: "TOP TRACKS"
    direction: UP
    speed: 80
    visibilityPercentage: 60
    waitToSettleTimeoutMs: 200
- tapOn:
    text: "[0-9]+:[0-9]{2}"
    index: 1
    waitToSettleTimeoutMs: 200
- pressKey: Remote Menu
- tapOn:
    text: "Now playing"
    waitToSettleTimeoutMs: 200
- assertVisible: "Sav(e|ed)"
- assertVisible: "Previous"

# 6. Now Playing -> artist -> Library -> Home.
- pressKey: Back
- assertVisible: "TOP TRACKS"
- pressKey: Back
- assertVisible: "Library"
- tapOn:
    text: "Sideplay"
    waitToSettleTimeoutMs: 200
- assertVisible: "Sideplay"
