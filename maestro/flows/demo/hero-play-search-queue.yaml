appId: io.github.manuelrtsch.sideplay
name: Hero - Play, Queue, Search
---
# record.sh prepares playback first; do not stop the app or the background song would end.
- launchApp:
    stopApp: false
- assertVisible: "Sideplay"

# 1. Open Now Playing from Home.
- tapOn: "NOW PLAYING"
- assertVisible: "Back"
- tapOn: "Back"

# 2. Show the queue.
- tapOn: "Queue"
- assertVisible: "Queue"
- tapOn: "Sideplay"

# 3. Search with the keypad and reopen the prepared track.
- tapOn: "Search"
- tapOn: "Search Spotify"
# The keypad mode is process-wide. Probe it, switch out of numeric mode if needed,
# then enter "toto" as T9 multi-tap digits (8 666 8 666).
- inputText: "0"
- extendedWaitUntil:
    visible: "Abc|ABC|abc|123"
    timeout: 10000
- runFlow:
    when:
      visible: "123"
    commands:
      - tapOn: "123"
      - extendedWaitUntil:
          visible: "Abc|ABC|abc"
          timeout: 5000
- eraseText: 40
- inputText: "86668666"
# Enter takes the exact suggestion and leaves the keypad open with Done still available.
- pressKey: Enter
- runFlow:
    when:
      visible: "Done"
    commands:
      - tapOn: "Done"
- waitForAnimationToEnd
- tapOn: "Africa"
# Africa is already current, so this opens Now Playing directly.
- assertVisible: "Back"
