appId: io.github.manuelrtsch.sideplay
name: Home -> Library -> Artist -> Now Playing -> Home
---
# No artist or track names are hardcoded. This assumes the account has at least two
# followed artists and the chosen artist has at least three top tracks.
- launchApp
- assertVisible: "Sideplay"

# 1. Open the Library and scroll to the followed artists.
- tapOn: "Library"
- assertVisible: "Library"
- scrollUntilVisible:
    element:
      text: "Artist"
      index: 1
    direction: DOWN
- waitForAnimationToEnd

# 2. Open the second followed artist.
- tapOn:
    text: "Artist"
    index: 1
- assertVisible: "TOP TRACKS"

# 3. Play the third top track. Durations are the only per-track text that matches
# this pattern, so index 2 is the third song regardless of its title.
- tapOn:
    text: "[0-9]+:[0-9]{2}"
    index: 2
- waitForAnimationToEnd

# Playing a new track shows a confirmation action; tapping it opens Now Playing.
# If the third track was already current, the tap above opened Now Playing directly.
- runFlow:
    when:
      visible: "Playing .* Open Now Playing"
    commands:
      - tapOn: "Playing .* Open Now Playing"
- assertVisible: "Save"
- assertVisible: "Previous"

# 4. Back out to Home: Now Playing -> artist -> Library -> Home.
- tapOn: "Back"
- assertVisible: "TOP TRACKS"
- tapOn: "Back"
- assertVisible: "Library"
- tapOn: "Sideplay"
- assertVisible: "Sideplay"
