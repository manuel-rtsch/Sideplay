appId: io.github.manuelrtsch.sideplay
name: Queue and History Management
---
# Assumes Home has at least two recently played rows and a current track.
# No track names are hardcoded: durations identify rows and the queue's
# Remove/Add actions are matched by their generated labels.
- launchApp
- assertVisible: "Sideplay"

# 1. Scroll to the recently played rows and add two songs to the queue.
- scrollUntilVisible:
    element:
      text: "[0-9]+:[0-9]{2}"
      index: 1
    direction: DOWN
- swipe:
    from:
      text: "[0-9]+:[0-9]{2}"
      index: 0
    direction: LEFT
- tapOn: "Add .* to queue"
- swipe:
    from:
      text: "[0-9]+:[0-9]{2}"
      index: 1
    direction: LEFT
- tapOn: "Add .* to queue"

# 2. Open the queue, remove the first upcoming item, then undo it.
- tapOn: "Queue"
- assertVisible: "Queue"
- swipe:
    from:
      text: "[0-9]+:[0-9]{2}"
      index: 1
    direction: LEFT
- tapOn: "Remove .* from queue"
# Undo is only offered for five seconds; tap it without a settle wait in between.
- tapOn: "Undo"
- assertNotVisible: "Undo"

# 3. Back to Home.
- tapOn: "Sideplay"
- assertVisible: "Sideplay"
- assertVisible: "RECENTLY PLAYED"

# 4. Toggle Autoplay, open Clear history, cancel, and return Home.
- pressKey: Remote Menu
- tapOn: "Settings"
- assertVisible: "Settings"
- tapOn: "Autoplay"
- scrollUntilVisible:
    element:
      text: "Clear history"
    direction: DOWN
- tapOn: "Clear history"
- assertVisible: "Cancel"
- tapOn: "Cancel"
- assertNotVisible: "Clear"
- tapOn: "Back"
- assertVisible: "Sideplay"
