<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Sidetrack app icon: the Schallplatte from the loading/status screens, brightened and
       centred on the app's default surface colour (#121212). -->
  <rect width="512" height="512" fill="#121212"/>

  <!-- Record body -->
  <circle cx="256" cy="256" r="150" fill="#2E2E2E"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#6B6B6B" stroke-width="3"/>

  <!-- Grooves -->
  <g fill="none" stroke="#4C4C4C" stroke-width="3">
    <circle cx="256" cy="256" r="89.25"/>
    <circle cx="256" cy="256" r="100.5"/>
    <circle cx="256" cy="256" r="111.75"/>
    <circle cx="256" cy="256" r="123"/>
    <circle cx="256" cy="256" r="134.25"/>
  </g>

  <!-- Centre label -->
  <circle cx="256" cy="256" r="51" fill="#2BB584"/>
  <circle cx="256" cy="256" r="51" fill="none" stroke="#B8F0DC" stroke-width="3"/>
  <circle cx="256" cy="256" r="8.25" fill="#121212"/>

  <!-- Specular highlight -->
  <path d="M 320.5 144.28 A 129 129 0 0 1 383.04 278.4"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"
        stroke-linecap="round"/>
</svg>
